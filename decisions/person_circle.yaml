# Which circle of the owner's life a person belongs to, the way the owner would
# file who they know: a sister is family, a client is work. The agent has no
# circles of its own: everyone it knows, it knows through its owner. Asked
# whenever a person's relation is learned or changes, with `relation` in the
# state, e.g. "Femi is Ada's husband.". {owner} is filled with the owner's
# name and {agent} with the agent's. The owner, from the character file, is
# filed without asking.
id: person_circle
version: 2
primary: circle

questions:
  - name: circle
    type: choice
    instructions: According to `relation`, which circle of {owner}'s life does the person belong to?
    choices:
      - {value: family, description: "{owner}'s relatives: parents, siblings, children, grandparents, aunts, uncles, cousins, in-laws."}
      - {value: partner, description: "{owner}'s romantic partner: girlfriend, boyfriend, wife, husband, fiancé."}
      - {value: friend, description: "{owner}'s friends, chosen and close: best friend, old friend, good friend."}
      - {value: school, description: "From {owner}'s learning: classmates, teachers, tutors, mentors, their children's teachers."}
      - {value: work, description: "From {owner}'s work: colleagues, staff, bosses, clients, customers, suppliers, accountants, business contacts."}
      - {value: community, description: "From where {owner} lives or belongs: neighbours, church or mosque members, club or team mates."}
      - {value: acquaintance, description: "Someone {owner} knows only casually or met briefly."}
      - {value: stranger, description: "Someone neither {owner} nor {agent} knows yet, like someone writing for the first time."}
      - {value: other, description: "None of the above."}

thresholds:
  act: 0.5 # unused: the most likely circle is stored, with its confidence in the log
  ask: 0.5
